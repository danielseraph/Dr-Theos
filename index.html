<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dr. Theo's Empowerment Hub</title>
    <style>
      /* Initial splash screen — shown before React hydrates */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0B1F33;
        transition: opacity 0.4s ease;
      }
      #splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .splash-ring-outer {
        position: absolute;
        width: 128px;
        height: 128px;
        border-radius: 50%;
        border: 4px solid transparent;
        border-top-color: #D6A84F;
        border-right-color: rgba(214,168,79,0.4);
        animation: spin-cw 1.2s linear infinite;
      }
      .splash-ring-inner {
        position: absolute;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        border: 4px solid transparent;
        border-bottom-color: rgba(214,168,79,0.6);
        border-left-color: rgba(214,168,79,0.2);
        animation: spin-ccw 2s linear infinite;
      }
      .splash-logo {
        width: 64px;
        height: 64px;
        border-radius: 12px;
        object-fit: cover;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        animation: pulse 1.5s ease-in-out infinite;
      }
      .splash-text {
        margin-top: 2rem;
        color: rgba(255,255,255,0.5);
        font-family: system-ui, sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        animation: fade-pulse 1.5s ease-in-out infinite;
      }
      .splash-ring-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 128px;
        height: 128px;
      }
      @keyframes spin-cw  { to { transform: rotate(360deg); } }
      @keyframes spin-ccw { to { transform: rotate(-360deg); } }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50%       { transform: scale(1.08); }
      }
      @keyframes fade-pulse {
        0%, 100% { opacity: 0.4; }
        50%       { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <!-- Initial splash (removed once React mounts) -->
    <div id="splash">
      <div class="splash-ring-wrap">
        <div class="splash-ring-outer"></div>
        <div class="splash-ring-inner"></div>
        <img class="splash-logo" src="/logo.jpg" alt="Loading" />
      </div>
      <p class="splash-text">Loading&hellip;</p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Fade out and remove the splash once the page is ready -->
    <script>
      window.addEventListener('load', function() {
        var splash = document.getElementById('splash');
        if (splash) {
          splash.classList.add('hidden');
          setTimeout(function() { splash.remove(); }, 500);
        }
      });
    </script>
  </body>
</html>
